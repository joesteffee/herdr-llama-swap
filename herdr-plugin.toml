id = "llama-swap"
name = "llama-swap Monitor"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Monitor and control a remote llama-swap model server from Herdr"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "src/cli.js", "daemon", "start"]

[[actions]]
id = "open-dashboard"
title = "llama-swap: show status tab"
description = "Show the live llama-swap dashboard as a tab in the desktop app's status space (herdr-core app tab)"
contexts = ["global"]
command = ["./bin/herdr-llama-swap", "--target", "hc"]

[[actions]]
id = "open-terminal"
title = "llama-swap: open plain herdr pane (workspace)"
description = "Open the live dashboard in a normal persistent Herdr workspace"
contexts = ["global"]
command = ["./bin/herdr-llama-swap", "--target", "workspace"]

[[actions]]
id = "status"
title = "llama-swap: print status"
contexts = ["global"]
command = ["node", "src/cli.js", "status"]

[[panes]]
id = "dashboard"
title = "llama-swap"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "src/cli.js", "dashboard"]
