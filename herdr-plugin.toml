id = "llama-swap"
name = "llama-swap Monitor"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Monitor and control a remote llama-swap model server from Herdr"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "src/cli.js", "daemon", "start"]

[[actions]]
id = "open-dashboard"
title = "llama-swap Dashboard"
description = "Show live model, tokens/sec, VRAM, GPU and load/unload controls"
contexts = ["global"]
command = ["./bin/herdr-llama-swap"]

[[actions]]
id = "status"
title = "llama-swap: print status"
contexts = ["global"]
command = ["node", "src/cli.js", "status"]

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "llama-swap.open-dashboard"
description = "Open llama-swap dashboard (alt+s)"

[[panes]]
id = "dashboard"
title = "llama-swap"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "src/cli.js", "dashboard"]
